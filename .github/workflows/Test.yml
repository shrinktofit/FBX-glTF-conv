name: Pull Request Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os_name: win32
            runner: windows-2022
            artifact_path: FBX-glTF-conv-ci-win32.tgz
          - label: macOS
            os_name: darwin
            runner: macos-15-intel
            artifact_path: FBX-glTF-conv-ci-darwin.tgz
          - label: Linux
            os_name: linux
            runner: ubuntu-22.04
            artifact_path: FBX-glTF-conv-ci-linux.tgz

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Build
        shell: bash
        run: |
          CI/build.sh -ArtifactPath "${{ matrix.artifact_path }}"

      - name: Print install tree
        shell: bash
        run: |
          find out/install -maxdepth 4 -type f -print

      - name: Run Windows tests
        if: matrix.os_name == 'win32'
        shell: pwsh
        run: |
          out/build/Release/Release/FBX-glTF-conv-core-test.exe
          out/build/Release/Release/FBX-glTF-conv-test.exe
          out/install/Release/bin/FBX-glTF-conv.exe --help

      - name: Run Linux tests
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          ./out/build/Release/FBX-glTF-conv-core-test
          ./out/build/Release/FBX-glTF-conv-test
          ./out/install/Release/bin/FBX-glTF-conv --help

      - name: Run macOS smoke test
        if: matrix.os_name == 'darwin'
        shell: bash
        run: |
          chmod +x ./out/install/Release/bin/FBX-glTF-conv
          ./out/install/Release/bin/FBX-glTF-conv --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_name }}
          path: ${{ matrix.artifact_path }}
